name: Infra Provisioning for BP Calculator Application
on:
    workflow_dispatch:
    push:
      paths-ignore:
        - '.github/workflows/**'
jobs:
  infrastructure-Provisioning:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./Terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./Terraform