name: Infra Provisioning for BP Calculator Application
on:
    workflow_dispatch:
        inputs:
            env:
                description: 'Terraform environment to manage'
                required: true
                default: 'create'
                type: choice
                options:
                    - create
                    - delete
        
jobs:
  infrastructure-Provisioning:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        if: ${{ github.event.inputs.env == 'create' }}
        uses: actions/checkout@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./Terraform

      - name: Terraform Apply
        if: ${{ github.event.inputs.env == 'create' }}
        run: terraform apply -auto-approve
        working-directory: ./Terraform

      - name: Terraform Destroy
        if: ${{ github.event.inputs.env == 'delete' }}
        run: terraform destroy -auto-approve
        working-directory: ./Terraform