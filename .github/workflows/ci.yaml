name: Bp_Application_Build_and_Deployment_CA1

on:
  workflow_dispatch:
  push:
    branches:
     # - main
      - dev
     # - test
     # - stage
    paths-ignore:
      - '.github/workflows/**'

env:
  DEV_ENV: dev-bp-D00001
  TEST_ENV: test-bp-T00001

jobs:
  BP-application-deployment:

    runs-on: self-hosted
    
    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Release Build
          run: |
            dotnet build --configuration Release



        - name: variable allocation
          run: |
            if: github.ref == 'refs/heads/dev'
            WEBAPP=${{ env.DEV_ENV }}
            elif: github.ref == 'refs/heads/test'
            WEBAPP=${{ env.DEV_ENV }}

        - name: Deploy to Azure Web App
          uses: azure/webapps-deploy@v2
          with:
            app-name: ${{ env.WEBAPP }} 
            publish-profile: ${{ secrets.WEBAPP }}
            package: ./publish