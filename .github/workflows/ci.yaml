name: Bp_Application_Build_and_Deployment_CA1

on:
  workflow_dispatch:
  push:
    branches:
     # - main
      - dev
      - test
     # - stage
    paths-ignore:
      - '.github/workflows/**'

env:
  BRANCH: ${{ github.ref_name }}
  REGISTRY_IMAGE: bpcalculator
  DEV_ENV: dev-nonprod
  TEST_ENV: test-nonprod

jobs:
  BP-application-deployment:

    runs-on: ubuntu-latest
    
    steps:
