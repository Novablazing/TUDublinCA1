        - name: Docker Image Build and Push
          run: |
            docker build -t tudublinca.azurecr.io/tudublin/bpcalculator:${{ github.run_number }} .
            docker push tudublinca.azurecr.io/tudublin/bpcalculator:${{ github.run_number }}
            docker images


        - name: Run Trivy vulnerability scanner
          uses: aquasecurity/trivy-action@0.28.0
          with:
            image-ref: 'tudublinca.azurecr.io/tudublin/bpcalculator:${{ github.run_number }}'
            format: 'table'
          #  exit-code: '1'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH,MEDIUM,LOW'
      
        #Additional steps of the code comes here

        

  BP-application-CD:
    if: always() && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/test'
    needs: BP-application-CI
    runs-on: ubuntu-22.04  
    
    steps:
    - name: Populating variables For Non Production Environments
      run: |
        if [ "$BRANCH" = "dev" ]; then
          WEBAPP="${{ env.DEV_ENV }}"
        else [ "$BRANCH" = "test" ]; then
          WEBAPP="${{ env.TEST_ENV }}"
        fi

    - name: Deploy to Azure Web App for Container
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.WEBAPP }}
        images: tudublinca.azurecr.io/tudublin/bpcalculator:${{ github.run_number }}