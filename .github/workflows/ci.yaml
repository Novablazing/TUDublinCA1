name: Bp_Application_Build

on:
  workflow_dispatch:
  push:
    branches:
     # - main
      - dev
     # - test
     # - stage
    paths-ignore:
      - '.github/workflows/**'

env:
  DEV_ENV: dev-bp-D00001
  TEST_ENV: test-bp-T00001
  PROD_ENV:

jobs:
  BP-application-deployment:

    runs-on: self-hosted
    
    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Release Build
          run: dotnet build --configuration Release

        - name: Deploy to Azure Web App
          uses: azure/webapps-deploy@v2
          with:
            app-name: 'bmitudublin' 
            slot-name: 'production'
            publish-profile: ${{ secrets.WEBAPP }}
            package: ./publish