        - name: Docker Login to Azure Container Registry
          uses: docker/login-action@v3.0.0
          with:
            registry: tudublinca.azurecr.io
            username: tudublinca  # Logging through service account.
            password: ${{ secrets.AZURE_DOCKER_PASSWORD }}

